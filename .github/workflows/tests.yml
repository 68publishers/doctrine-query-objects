name: Tests

on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:
    branches:
      - master

jobs:
  tests:
    name: Unit Tests [PHP ${{ matrix.php-versions }}]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: ['8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: pdo_sqlite
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-progress --prefer-dist --prefer-stable --optimize-autoloader --quiet

      - name: Run tests
        run: vendor/bin/tester -C -s ./tests

      - name: Install dependencies (lowest)
        run: composer update --no-progress --prefer-dist --prefer-lowest --prefer-stable --optimize-autoloader --quiet

      - name: Run tests (lowest)
        # the lowest third-party versions (doctrine/persistence, doctrine/dbal) trigger deprecations, they are verified by the highest run
        env:
          TESTS_IGNORE_DEPRECATIONS: 1
        run: vendor/bin/tester -C -s ./tests
